<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Invoice Review</title>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --border: #dcdcdc;
    --accent: #2b5fb8;
    --accent-dark: #1e468c;
    --bg: #f7f7f5;
    --panel: #ffffff;
    --danger: #b3392b;
    --success: #2a7d4f;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 40px 20px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

  /* --- config bar (collapsible) --- */
  details.config {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 24px;
    font-size: 13px;
  }
  details.config summary { cursor: pointer; color: var(--muted); }
  .config label { display: block; margin-top: 10px; font-weight: 600; }
  .config input { width: 100%; padding: 6px 8px; margin-top: 4px; border: 1px solid var(--border); border-radius: 5px; font-size: 13px; }

  /* --- drop zone --- */
  #dropzone {
    background: var(--panel);
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 48px 20px;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #dropzone.drag { border-color: var(--accent); background: #eef3fc; }
  #dropzone strong { color: var(--ink); }
  #fileInput { display: none; }

  /* --- states --- */
  #status { margin-top: 16px; font-size: 14px; }
  #status.error { color: var(--danger); }
  #status.success { color: var(--success); }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite;
    vertical-align: -2px; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* --- review form --- */
  #reviewPanel { display: none; margin-top: 28px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .03em;
    color: var(--muted); margin-bottom: 4px;
  }
  .field input, .field textarea {
    width: 100%; padding: 9px 10px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 6px;
    font-family: inherit; background: #fff;
  }
  .field textarea { resize: vertical; min-height: 50px; }

  table.items { width: 100%; border-collapse: collapse; margin-top: 6px; }
  table.items th {
    text-align: left; font-size: 11px; text-transform: uppercase;
    color: var(--muted); font-weight: 600; padding: 6px 6px;
    border-bottom: 1px solid var(--border);
  }
  table.items td { padding: 5px 6px; }
  table.items input {
    width: 100%; padding: 6px 7px; font-size: 13px;
    border: 1px solid var(--border); border-radius: 5px;
  }
  .row-remove {
    background: none; border: none; color: var(--danger);
    cursor: pointer; font-size: 16px; line-height: 1;
    padding: 4px 8px;
  }
  .add-row {
    margin-top: 8px; background: none; border: 1px dashed var(--border);
    color: var(--accent); padding: 7px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  .readonly-note {
    font-size: 12px; color: var(--muted); background: #f2f2f0;
    padding: 8px 10px; border-radius: 6px;
  }

  .actions { display: flex; gap: 10px; margin-top: 20px; }
  button.primary {
    background: var(--accent); color: #fff; border: none;
    padding: 11px 22px; border-radius: 7px; font-size: 14px;
    font-weight: 600; cursor: pointer;
  }
  button.primary:hover { background: var(--accent-dark); }
  button.primary:disabled { background: #a9a9a9; cursor: not-allowed; }
  button.secondary {
    background: none; border: 1px solid var(--border); color: var(--ink);
    padding: 11px 18px; border-radius: 7px; font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Invoice Review</h1>
  <div class="sub">Drop a scanned invoice, check the extracted data, then submit.</div>

  <div id="queueCounter" style="display:none; font-size:13px; font-weight:600; color:var(--accent); margin-bottom:10px;"></div>
  <div id="dropzone">
    <div><strong>Drop invoice here</strong> or click to browse</div>
    <div style="font-size:12px; margin-top:6px;">PDF or image files</div>
    <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff" multiple />
  </div>
  <div id="status"></div>

  <div id="reviewPanel">
    <div class="card">
      <div id="formFields"></div>
    </div>
    <div class="actions">
      <button class="primary" id="submitBtn">Confirm &amp; Submit to Magento</button>
      <button class="secondary" id="startOverBtn">Start Over</button>
    </div>
  </div>
</div>

<script>
  // Shared secret sent with every webhook request, must match the Header Auth
  // credential value configured on both webhook nodes in n8n
  const API_KEY = '79cc6b2c593868debff80f6f5b0d7d77a1db74cef650c977';
  const INTAKE_URL = 'https://devinesai.app.n8n.cloud/webhook/invoice-intake';
  const CONFIRM_URL = 'https://devinesai.app.n8n.cloud/webhook/invoice-confirm';
  // Valid item_key values with their item names, used to populate the
  // Item Key dropdown. Note: code 260 intentionally appears twice
  // (Twin XL Wood Frame, and Desk and Chair) - both are valid, distinct items.
  const ITEM_KEY_OPTIONS = [
    ['500', 'Twin Set (Frame, Box Spring, Mattress)'],
    ['501', 'Full Set (Frame, Box Spring, Mattress)'],
    ['502', 'Queen Set (Frame, Box Spring, Mattress)'],
    ['503', 'Twin/Full/Queen Frame ONLY - Metal'],
    ['504', 'Twin Box Spring Only'],
    ['505', 'Full Box Spring Only'],
    ['506', 'Queen Box Spring Only'],
    ['507', 'Twin Mattress Only'],
    ['508', 'Full Size Mattress Only'],
    ['509', 'Queen Size Mattress Only'],
    ['513', 'Twin/Full/Queen Air Mattress'],
    ['514', 'Foldaway Bed'],
    ['520', 'Twin XL Set (Frame, Box Spring, Mattress)'],
    ['600', '4 Pc Twin Bed Sheet Set (Includes Comforter)'],
    ['601', '4 Pc Full Sheet Set (Includes Comforter)'],
    ['602', '4 Pc Queen Sheet Set w/Comforter'],
    ['603', '3 Pc Crib Sheet Set (Includes Comforter)'],
    ['604', '4 Pc Toddler Sheet Set w/Comforter'],
    ['605', 'Bed Bug Mattress Cover - T/F/Q'],
    ['606', 'Toddler(Crib)/Twin/Full/Waterproof Mattress Cover'],
    ['201', 'METAL Bunk Bed w/ Mattresses'],
    ['202', 'WOOD Bunk Bed w/ Mattresses'],
    ['214', 'METAL Twin/Full Bunk Bed w/ Mattresses'],
    ['215', 'WOOD Twin/Full Bunk Bed w/ Mattresses'],
    ['255', "Captain's Bed With Drawers - TWIN"],
    ['241', "Captain's Bed With Drawers - FULL"],
    ['230', "Captain's Bed With Trundle - TWIN"],
    ['233', "Captain's Bed With Trundle - FULL"],
    ['210', 'Twin Sets (matt, box spring, frame) - WOOD'],
    ['252', 'Twin FRAME ONLY - WOOD'],
    ['211', 'Full Sets (matt, box spring, frame) - WOOD'],
    ['212', 'Queen Sets (matt, box spring, frame) - WOOD'],
    ['253', 'Full FRAME ONLY - WOOD'],
    ['254', 'Queen Set - WOOD - FRAME ONLY'],
    ['260', 'Twin XL (matt, box spring, frame) - WOOD'],
    ['206', 'Chest'],
    ['207', '6 Drawer Dresser'],
    ['208', '6 Drawer Dresser w/ Mirror'],
    ['260', 'Desk and Chair - Solid Wood'],
    ['402', 'Kitchen Table - 4 Chairs'],
    ['403', 'Kitchen Table - 6 Chairs'],
    ['300', 'Convertible Sofa'],
    ['301', '3 Pc Living Room Set (Sofa, Loveseat, Chair)'],
    ['306', 'Futon with Frame'],
    ['722', 'Lamp - Floor'],
    ['721', 'Lamp - Table'],
    ['100', 'Crib Set (Crib & Mattress)'],
    ['101', 'Convertible Crib'],
    ['103', 'Toddler Bed w/ Mattress'],
    ['107', 'Single Stroller'],
    ['109', 'Double Stroller'],
    ['110', 'Baby Gate'],
    ['112', 'Pack & Play/Portable Crib'],
    ['113', 'High Chair'],
    ['121', 'Table Booster Seat'],
    ['119', 'Infant Car Seat BASE ONLY'],
    ['114', 'Infant Car Seat'],
    ['120', 'Convertible Car Seat (Toddler)'],
    ['115', 'Toddler Car Seat'],
    ['116', 'Car Booster Seat (Child)'],
    ['117', 'Travel System (Infant Car Seat & Stroller)'],
    ['118', 'Bed Safety Guard Rail'],
    ['125', 'Bassinet'],
    ['135', 'Baby Monitor - VIDEO'],
    ['130', 'Baby Monitor - NO VIDEO'],
    ['702', '10000 BTU Air Conditioner'],
    ['701', '8000 BTU Air Conditioner'],
    ['708', '6000 BTU Air Conditioner'],
    ['700', '5000 BTU Air Conditioner'],
    ['703', '18 Cu. Ft. Refrigerator'],
    ['706', '15 Cu. Ft. Refrigerator'],
    ['705', '12 Cu. Ft. Refrigerator'],
    ['704', '10 Cu. Ft. Refrigerator'],
    ['707', '3.5 Cu. Ft. Refrigerator'],
    ['714', 'Washer'],
    ['715', 'Dryer (Electric)'],
    ['719', 'Dryer (Gas)'],
    ['716', 'Stove (Electric)'],
    ['717', 'Stove (Gas)'],
    ['720', 'Microwave'],
    ['725', 'Stackable Washer/Dryer - Electric'],
    ['726', 'Stackable Washer/Dryer - Gas'],
    ['709', 'Heater - Electric'],
    ['800', 'Radiator Cover'],
    ['801', 'Window Guard'],
    ['802', 'Gun/Ammunition Lock Box'],
    ['803', 'Medication Lock Box'],
    ['804', 'Humidifier'],
    ['805', 'Dehumidifier'],
    ['806', 'First Aid Kit'],
    ['807', 'Carbon Monoxide Detector'],
    ['808', 'Smoke Detector'],
    ['809', 'Fire Extinguisher'],
    ['810', 'Door Alarms'],
    ['811', 'Window Screens - Custom'],
    ['812', 'Window Screens - Adjustable']
  ];

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const statusEl = document.getElementById('status');
  const queueCounter = document.getElementById('queueCounter');
  const reviewPanel = document.getElementById('reviewPanel');
  const formFields = document.getElementById('formFields');
  const submitBtn = document.getElementById('submitBtn');
  const startOverBtn = document.getElementById('startOverBtn');

  // Remember webhook URLs in memory for this session (not localStorage, per artifact rules)
  let draftData = null;      // the editable working copy
  let readonlyBlobs = {};    // fields we don't render editable inputs for (e.g. Attachments)
  let fileQueue = [];        // files waiting to be processed, one order per file
  let currentFileIndex = 0;  // which file in the queue is currently being reviewed

  // ---------- Upload handling ----------
  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag');
    if (e.dataTransfer.files.length) handleFiles(Array.from(e.dataTransfer.files));
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) handleFiles(Array.from(fileInput.files));
  });

  // Document AI only supports these formats - anything else gets rejected
  // immediately instead of failing later with a cryptic backend error
  const SUPPORTED_TYPES = [
    'application/pdf', 'image/png', 'image/jpeg', 'image/tiff',
    'image/gif', 'image/bmp', 'image/webp'
  ];

  // Starts a new queue of files and kicks off processing the first one
  function handleFiles(files) {
    const rejected = files.filter(f => !SUPPORTED_TYPES.includes(f.type));
    const accepted = files.filter(f => SUPPORTED_TYPES.includes(f.type));

    if (rejected.length) {
      const names = rejected.map(f => f.name).join(', ');
      setStatus('Skipped unsupported file(s): ' + names + '. Only PDF, PNG, JPG, TIFF, GIF, BMP, and WEBP are supported.', 'error');
    }

    if (!accepted.length) return;

    fileQueue = accepted;
    currentFileIndex = 0;
    updateQueueCounter();
    processNextFile();
  }

  // Shows how many orders are left in the current batch, above the dropzone
  function updateQueueCounter() {
    const remaining = fileQueue.length - currentFileIndex;
    if (fileQueue.length > 1 && remaining > 0) {
      queueCounter.textContent = remaining + ' of ' + fileQueue.length + ' orders remaining';
      queueCounter.style.display = 'block';
    } else {
      queueCounter.style.display = 'none';
    }
  }

  // Sends the next file in the queue through the existing single-order flow
  function processNextFile() {
    if (currentFileIndex >= fileQueue.length) {
      setStatus('All ' + fileQueue.length + ' order(s) processed.', 'success');
      fileQueue = [];
      return;
    }
    handleFile(fileQueue[currentFileIndex]);
  }

  async function handleFile(file) {
    const intakeUrl = INTAKE_URL;
    const progress = fileQueue.length > 1
      ? ' (order ' + (currentFileIndex + 1) + ' of ' + fileQueue.length + ')'
      : '';
    setStatus('<span class="spinner"></span>Extracting data from invoice' + progress + '...', '');
    reviewPanel.style.display = 'none';

    try {
      const formData = new FormData();
      formData.append('file', file, file.name);

      const res = await fetch(intakeUrl, {
        method: 'POST',
        headers: { 'X-API-Key': API_KEY },
        body: formData
      });
      if (!res.ok) throw new Error('Server responded with ' + res.status);
      const data = await res.json();

      // n8n often wraps output in an array or {json: {...}} - normalize it
      draftData = normalize(data);
      setStatus('Extraction complete' + progress + '. Review the details below.', 'success');
      renderForm(draftData);
      reviewPanel.style.display = 'block';
    } catch (err) {
      setStatus('Extraction failed: ' + err.message, 'error');
    }
  }

  function normalize(data) {
    if (Array.isArray(data)) data = data[0] || {};
    if (data && data.json) data = data.json;
    return data || {};
  }

  function setStatus(html, cls) {
    statusEl.innerHTML = html;
    statusEl.className = cls || '';
  }

  // ---------- Form rendering ----------
  function renderForm(data) {
    formFields.innerHTML = '';
    readonlyBlobs = {};

    Object.keys(data).forEach(key => {
      const value = data[key];

      if (Array.isArray(value)) {
        formFields.appendChild(renderItemsTable(key, value));
      } else if (value && typeof value === 'object') {
        // e.g. Attachments: { Filename, Base64 } - keep as-is, show read-only summary
        readonlyBlobs[key] = value;
        const note = document.createElement('div');
        note.className = 'field';
        const label = document.createElement('label');
        label.textContent = key;
        const info = document.createElement('div');
        info.className = 'readonly-note';
        info.textContent = value.Filename
          ? ('Attached file: ' + value.Filename + ' (kept as-is, not editable here)')
          : 'Data carried through unchanged';
        note.appendChild(label);
        note.appendChild(info);
        formFields.appendChild(note);
      } else {
        formFields.appendChild(renderTextField(key, value));
      }
    });
  }

  const LOCAL_OFFICE_OPTIONS = [
    'Atlantic East', 'Atlantic West', 'Bergen Central', 'Bergen South',
    'Burlington East', 'Burlington West', 'Camden Central', 'Camden North',
    'Camden South', 'Camden East', 'Cape May', 'Cumberland East',
    'Cumberland West', 'Newark Center City', 'Newark Northeast', 'Essex Central',
    'Essex North', 'Essex South', 'Gloucester East', 'Gloucester West',
    'Hudson Central', 'Hudson North', 'Hudson West', 'Hudson South',
    'Hunterdon Local', 'Mercer North', 'Mercer South', 'Middlesex Central',
    'Middlesex Coastal', 'Middlesex West', 'Monmouth North', 'Monmouth South',
    'Morris East', 'Morris West', 'Ocean North', 'Ocean South',
    'Passaic Central', 'Passaic North', 'Salem Local', 'Somerset Local',
    'Sussex Local', 'Union Central', 'Union East', 'Union West', 'Warren Local'
  ];

  function renderTextField(key, value) {
    const wrap = document.createElement('div');
    wrap.className = 'field';
    const label = document.createElement('label');
    label.textContent = key;
    let input;
    if (key === 'local_office') {
      input = document.createElement('select');
      const blankOpt = document.createElement('option');
      blankOpt.value = '';
      blankOpt.textContent = '-- select office --';
      input.appendChild(blankOpt);
      const currentVal = value == null ? '' : String(value);
      let matched = false;
      LOCAL_OFFICE_OPTIONS.forEach(office => {
        const opt = document.createElement('option');
        opt.value = office;
        opt.textContent = office;
        if (office === currentVal) matched = true;
        input.appendChild(opt);
      });
      if (currentVal && !matched) {
        const unknownOpt = document.createElement('option');
        unknownOpt.value = currentVal;
        unknownOpt.textContent = currentVal + ' (not on list - please verify)';
        input.appendChild(unknownOpt);
      }
      input.value = currentVal;
    } else {
      input = document.createElement(String(value).length > 60 ? 'textarea' : 'input');
      input.value = value == null ? '' : value;
    }
    input.dataset.fieldKey = key;
    input.dataset.fieldType = 'scalar';
    wrap.appendChild(label);
    wrap.appendChild(input);
    return wrap;
  }

  function renderItemsTable(key, items) {
    const wrap = document.createElement('div');
    wrap.className = 'field';
    wrap.dataset.fieldKey = key;
    wrap.dataset.fieldType = 'array';

    const label = document.createElement('label');
    label.textContent = key;
    wrap.appendChild(label);

  // Explicit column sets for fields we know the shape of, so empty
  // arrays still render the right headers instead of a generic 'value' column
  const KNOWN_COLUMNS = {
    line_items: ['item', 'item_key', 'item_qty', 'item_amt'],
    participants: ['participant_id', 'participant_name']
  };

  const columns = KNOWN_COLUMNS[key] || (items.length ? Object.keys(items[0]) : ['value']);


    const table = document.createElement('table');
    table.className = 'items';
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    columns.forEach(c => {
      const th = document.createElement('th');
      th.textContent = c;
      headRow.appendChild(th);
    });
    headRow.appendChild(document.createElement('th'));
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    items.forEach(item => tbody.appendChild(makeItemRow(columns, item)));
    table.appendChild(tbody);
    wrap.appendChild(table);
    wrap._tbody = tbody;
    wrap._columns = columns;

    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'add-row';
    addBtn.textContent = '+ Add row';
    addBtn.addEventListener('click', () => {
      const blank = {};
      columns.forEach(c => blank[c] = '');
      tbody.appendChild(makeItemRow(columns, blank));
    });
    wrap.appendChild(addBtn);

    return wrap;
  }

  function makeItemRow(columns, item) {
    const tr = document.createElement('tr');
    columns.forEach(col => {
      const td = document.createElement('td');
      let input;
      if (col === 'item_key') {
        input = document.createElement('select');
        const blankOpt = document.createElement('option');
        blankOpt.value = '';
        blankOpt.textContent = '-- select --';
        input.appendChild(blankOpt);
        const currentVal = item[col] == null ? '' : String(item[col]);
        let matched = false;
        ITEM_KEY_OPTIONS.forEach(([code, name]) => {
          const opt = document.createElement('option');
          opt.value = code;
          opt.textContent = code + ' \u2013 ' + name;
          if (code === currentVal) matched = true;
          input.appendChild(opt);
        });
        // If the extracted value doesn't match any known code, keep it
        // visible as its own option instead of silently discarding it
        if (currentVal && !matched) {
          const unknownOpt = document.createElement('option');
          unknownOpt.value = currentVal;
          unknownOpt.textContent = currentVal + ' (not on list - please verify)';
          input.appendChild(unknownOpt);
        }
        input.value = currentVal;
      } else {
        input = document.createElement('input');
        input.value = item[col] == null ? '' : item[col];
      }
      input.dataset.col = col;
      td.appendChild(input);
      tr.appendChild(td);
    });
    const removeTd = document.createElement('td');
    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'row-remove';
    removeBtn.textContent = '\u2715';
    removeBtn.addEventListener('click', () => tr.remove());
    removeTd.appendChild(removeBtn);
    tr.appendChild(removeTd);
    return tr;
  }

  // ---------- Collect edited data ----------
  function collectFormData() {
    const result = { ...readonlyBlobs };

    formFields.querySelectorAll('[data-field-type="scalar"]').forEach(input => {
      result[input.dataset.fieldKey] = input.value;
    });

    formFields.querySelectorAll('[data-field-type="array"]').forEach(wrap => {
      const key = wrap.dataset.fieldKey;
      const columns = wrap._columns;
      const rows = [];
      wrap._tbody.querySelectorAll('tr').forEach(tr => {
        const rowObj = {};
        tr.querySelectorAll('input[data-col]').forEach(input => {
          rowObj[input.dataset.col] = input.value;
        });
        rows.push(rowObj);
      });
      result[key] = rows;
    });

    return result;
  }

  // ---------- Submit ----------
  submitBtn.addEventListener('click', async () => {
    const confirmUrl = CONFIRM_URL;
    const payload = collectFormData();
    submitBtn.disabled = true;
    setStatus('<span class="spinner"></span>Submitting to Magento...', '');

    try {
      const res = await fetch(confirmUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('Server responded with ' + res.status);
      const result = await res.json();
      reviewPanel.style.display = 'none';

      currentFileIndex++;
      updateQueueCounter();
      if (currentFileIndex < fileQueue.length) {
        setStatus('Order submitted. Loading next order...', 'success');
        processNextFile();
      } else {
        setStatus('All orders submitted successfully.', 'success');
        fileQueue = [];
      }
    } catch (err) {
      setStatus('Submit failed: ' + err.message, 'error');
    } finally {
      submitBtn.disabled = false;
    }
  });

  startOverBtn.addEventListener('click', () => {
    reviewPanel.style.display = 'none';
    fileInput.value = '';
    fileQueue = [];
    currentFileIndex = 0;
    queueCounter.style.display = 'none';
    setStatus('', '');
  });
</script>
</body>
</html>
